name: Nightly Events Auto-Update

on:
  schedule:
    # Runs daily at 04:00 UTC (9:00 PM PDT / 8:00 PM PST)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Event Auto-Updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_update_events.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if ! git diff --quiet events.json; then
            git add events.json
            git commit -m "Auto-update community events [skip ci]"
            git push origin main
          else
            echo "events.json is up to date. No changes to commit."
          fi
